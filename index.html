<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>imagine there's no heaven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

    rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.9">
</head>

<body>

  <!-- Intro Splash Overlay -->
  <div id="intro-overlay" class="intro-overlay" title="Click to skip intro">
    <img src="intro.gif" alt="Intro Animation" class="intro-gif">
  </div>

  <!-- Noise Overlay for extra grit -->
  <div class="noise-overlay"></div>

  <!-- The Wall Fixed Background Elements -->
  <div class="brick-texture-bg"></div>
  <img src="the_wall_characters.jpg" class="the-wall-art" alt="The Wall Artwork">

  <!-- Navigation -->
  <nav class="navbar">
    <a href="#" class="logo-link" title="Click to Play/Pause Music"><img src="brick-logo.png" alt="Brick Logo" class="logo-img"></a>

    <ul class="nav-links">
      <li><a href="#welcome">Welcome</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#tv-section">TV</a></li>
      <li><a href="#taste">Taste</a></li>
    </ul>

    <!-- Volume Control -->
    <div class="header-volume">
      <div class="volume-toggle" id="volume-toggle" title="Mute/Unmute">
        <div class="volume-bar"></div>
        <div class="volume-bar"></div>
        <div class="volume-bar"></div>
      </div>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
    </div>
  </nav>

  <main>
    <!-- Section: Welcome to My Wall -->
    <section id="welcome" class="theme-wall section-content">
      <div class="content-wrapper welcome-wrapper">
        <div class="profile-frame">
          <img src="My Wall (red).png" alt="My Wall Red Profile" class="profile-img">
        </div>
        <div class="welcome-textual">
          <h1 class="scarfe-title">WELCOME TO MY WALL</h1>
          <p class="scarfe-sub">ANALOG MEMORIES & STORIES</p>
        </div>
      </div>
    </section>

    <!-- Section: Projects & Misc (Prog Rock / The Wall) -->
    <section id="projects" class="theme-wall section-content">
      <div class="content-wrapper wall-wrapper">
        <div class="wall-textual-assault">
          <h2 class="scarfe-title">TEAR DOWN THE WALL</h2>
          <p class="scarfe-sub">PROJECTS AND MISC OUT THERE</p>
        </div>

        <div class="graffiti-grid">
          <div class="graffiti-item">
            <h4 class="blood-text">Brick</h4>
          </div>
          <div class="graffiti-item">
            <h4 class="blood-text">Rebar</h4>
          </div>
          <div class="graffiti-item">
            <h4 class="blood-text">Palisade</h4>
          </div>
        </div>

      </div>
    </section>

    <!-- Section: 13 Channels of Shit (Retro TV Section) -->
    <section id="tv-section" class="theme-wall section-content">
      <div class="content-wrapper tv-section-wrapper">
        <div class="wall-textual-assault">
          <h2 class="scarfe-title">13 CHANNELS OF SHIT</h2>
          <p class="scarfe-sub">Nobody Home CRT Viewer</p>
        </div>

        <div class="tv-cabinet">
          <!-- TV Screen Bezel -->
          <div class="tv-bezel">
            <!-- Screen Glass -->
            <div id="tv-screen" class="tv-screen power-off">
              <!-- CRT scanlines overlay -->
              <div class="crt-scanlines"></div>
              <!-- CRT screen reflection/curve overlay -->
              <div class="crt-reflection"></div>
              <!-- TV Static Canvas -->
              <canvas id="tv-static-canvas" class="tv-static-canvas"></canvas>
              
              <!-- Channel Contents -->
              <div id="tv-channel-content" class="tv-channel-content"></div>

              <!-- Power-off indicator dot -->
              <div class="crt-power-dot"></div>
            </div>
          </div>

          <!-- TV Controls Bezel -->
          <div class="tv-controls">
            <!-- Power Switch -->
            <div class="control-group">
              <label class="control-label">POWER</label>
              <div id="tv-power-switch" class="tv-power-switch off" title="Toggle Power">
                <div class="switch-knob"></div>
              </div>
            </div>

            <!-- Channel Rotary Knob -->
            <div class="control-group">
              <label class="control-label">CHANNEL</label>
              <div id="tv-knob" class="tv-knob" title="Click to Cycle Channel">
                <div class="knob-line"></div>
              </div>
              <div id="tv-channel-display" class="tv-channel-display">--</div>
            </div>

            <!-- Buttons Grid (1-13) -->
            <div class="channel-buttons-grid">
              <button class="channel-btn" data-channel="1">1</button>
              <button class="channel-btn" data-channel="2">2</button>
              <button class="channel-btn" data-channel="3">3</button>
              <button class="channel-btn" data-channel="4">4</button>
              <button class="channel-btn" data-channel="5">5</button>
              <button class="channel-btn" data-channel="6">6</button>
              <button class="channel-btn" data-channel="7">7</button>
              <button class="channel-btn" data-channel="8">8</button>
              <button class="channel-btn" data-channel="9">9</button>
              <button class="channel-btn" data-channel="10">10</button>
              <button class="channel-btn" data-channel="11">11</button>
              <button class="channel-btn" data-channel="12">12</button>
              <button class="channel-btn" data-channel="13">13</button>
            </div>

            <!-- Speaker Grill Vents -->
            <div class="tv-speaker-grill">
              <div class="grill-slat"></div>
              <div class="grill-slat"></div>
              <div class="grill-slat"></div>
              <div class="grill-slat"></div>
              <div class="grill-slat"></div>
              <div class="grill-slat"></div>
              <div class="grill-slat"></div>
              <div class="grill-slat"></div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Section: Music Taste (The Wall Brick Themed) -->
    <section id="taste" class="theme-punk section-content">
      <div class="content-wrapper punk-wrapper">
        <h2 class="scarfe-title">IS THERE ANYBODY OUT THERE?</h2>

        <div class="slashed-grid">
          <!-- Playlist 1 -->
          <div class="brick-card brick-card-1">
            <iframe style="border-radius:0px"
              src="https://open.spotify.com/embed/playlist/41b2SzteSYd21jChRjdZdJ?utm_source=generator" width="100%"
              height="352" frameBorder="0" allowfullscreen=""
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"></iframe>
          </div>
          <!-- Playlist 2 -->
          <div class="brick-card brick-card-2">
            <iframe style="border-radius:0px"
              src="https://open.spotify.com/embed/playlist/5nlfLOnW6GLqG2rbg8bBAm?utm_source=generator" width="100%"
              height="352" frameBorder="0" allowfullscreen=""
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"></iframe>
          </div>
          <!-- Playlist 3 -->
          <div class="brick-card brick-card-3">
            <iframe style="border-radius:0px"
              src="https://open.spotify.com/embed/playlist/683NDQxAOWDsQXYBNaGc6b?utm_source=generator" width="100%"
              height="352" frameBorder="0" allowfullscreen=""
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>make by kiet minh - apokaliptics</p>
  </footer>

  <!-- Default Page Background Song -->
  <audio id="bg-music" src="10 One Of My Turns.mp3" loop
    style="display: none;"></audio>

  <script data-goatcounter="https://apokaliptics.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

  <script>
    const bgMusic = document.getElementById('bg-music');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeToggle = document.getElementById('volume-toggle');
    const logoLink = document.querySelector('.logo-link');

    // Sync initial volume
    bgMusic.volume = volumeSlider.value;

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      bgMusic.volume = val;
      if (val === 0) {
        volumeToggle.classList.add('muted');
      } else {
        volumeToggle.classList.remove('muted');
      }
    });

    // Mute/unmute on icon click
    volumeToggle.addEventListener('click', () => {
      if (bgMusic.volume > 0) {
        bgMusic.dataset.lastVolume = bgMusic.volume;
        volumeSlider.value = 0;
        bgMusic.volume = 0;
        volumeToggle.classList.add('muted');
      } else {
        const lastVol = bgMusic.dataset.lastVolume || 1;
        volumeSlider.value = lastVol;
        bgMusic.volume = lastVol;
        volumeToggle.classList.remove('muted');
      }
    });

    function toggleMusic() {
      if (bgMusic.paused) {
        bgMusic.play().catch(console.error);
      } else {
        bgMusic.pause();
      }
    }

    // Play on logo click
    logoLink.addEventListener('click', (e) => {
      e.preventDefault();
      toggleMusic();

      // Visual feedback on click
      logoLink.style.transform = 'scale(0.95)';
      setTimeout(() => {
        logoLink.style.transform = 'scale(1)';
      }, 150);
    });

    // Intro Overlay Dismissal
    const introOverlay = document.getElementById('intro-overlay');

    function enterSite() {
      if (!introOverlay.classList.contains('fade-out')) {
        introOverlay.classList.add('fade-out');
        bgMusic.play().catch(console.error);
        // Remove overlay from DOM after transition completes to keep DOM clean
        setTimeout(() => {
          introOverlay.remove();
        }, 1000);
      }
    }

    // Auto-transition timeout (4500ms is standard GIF length, editable if needed)
    const autoEnterTimeout = setTimeout(enterSite, 4500);

    // Skip/Enter on overlay click
    introOverlay.addEventListener('click', () => {
      clearTimeout(autoEnterTimeout);
      enterSite();
    });

    // -------------------------------------
    // TV CHANNEL STATE & CONTROLS
    // -------------------------------------
    let tvPower = false;
    let tvChannel = 1;
    let staticInterval = null;
    const tvScreen = document.getElementById('tv-screen');
    const tvKnob = document.getElementById('tv-knob');
    const tvChannelDisplay = document.getElementById('tv-channel-display');
    const tvPowerSwitch = document.getElementById('tv-power-switch');
    const tvChannelContent = document.getElementById('tv-channel-content');
    const tvStaticCanvas = document.getElementById('tv-static-canvas');
    const ctx = tvStaticCanvas.getContext('2d');

    // Canvas resolution setup
    tvStaticCanvas.width = 320;
    tvStaticCanvas.height = 240;

    const channelsData = {
      1: { type: 'image', src: 'hcm masoleum.jpg', title: 'HCM Mausoleum', desc: 'POSTCARD #1' },
      2: { type: 'image', src: 'hcm1.jpg', title: 'HCM Opera House', desc: 'POSTCARD #2' },
      3: { type: 'static' },
      4: { type: 'image', src: 'hcm3.jpg', title: 'Independence Palace', desc: 'POSTCARD #3' },
      5: { type: 'colorbars' },
      6: { type: 'image', src: 'landmark81.jpg', title: 'Landmark 81', desc: 'POSTCARD #4' },
      7: { type: 'static' },
      8: { type: 'image', src: 'nhatrang.jpg', title: 'Nha Trang', desc: 'POSTCARD #5' },
      9: { type: 'standby' },
      10: { type: 'image', src: 'vungtau.jpg', title: 'Vung Tau', desc: 'POSTCARD #6' },
      11: { type: 'lyrics', text: 'I\'ve got thirteen channels of shit on the T.V. to choose from...', source: 'Nobody Home (1979)' },
      12: { type: 'static' },
      13: { type: 'image', src: 'the_wall_characters.jpg', title: 'The Wall Cast', desc: 'GERALD SCARFE ART' }
    };

    function renderStatic() {
      if (!tvPower) return;
      const imgData = ctx.createImageData(tvStaticCanvas.width, tvStaticCanvas.height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const val = Math.floor(Math.random() * 255);
        data[i] = val;
        data[i+1] = val;
        data[i+2] = val;
        data[i+3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function startStatic() {
      if (staticInterval) clearInterval(staticInterval);
      tvStaticCanvas.style.display = 'block';
      staticInterval = setInterval(renderStatic, 50);
    }

    function stopStatic() {
      if (staticInterval) {
        clearInterval(staticInterval);
        staticInterval = null;
      }
      tvStaticCanvas.style.display = 'none';
    }

    function updateTV() {
      if (!tvPower) {
        tvScreen.classList.add('power-off');
        tvScreen.classList.remove('power-on');
        tvChannelDisplay.innerText = '--';
        tvChannelContent.innerHTML = '';
        stopStatic();
        return;
      }

      tvScreen.classList.remove('power-off');
      tvScreen.classList.add('power-on');
      
      tvChannelDisplay.innerText = tvChannel < 10 ? '0' + tvChannel : tvChannel;

      // Update button selection
      document.querySelectorAll('.channel-btn').forEach(btn => {
        if (parseInt(btn.dataset.channel) === tvChannel) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const chan = channelsData[tvChannel];
      if (!chan) return;

      if (chan.type === 'static') {
        tvChannelContent.innerHTML = '';
        startStatic();
      } else {
        stopStatic();
        if (chan.type === 'image') {
          tvChannelContent.innerHTML = `
            <div class="tv-image-content">
              <img src="${chan.src}" class="tv-screen-img">
              <div class="tv-screen-text">${chan.title}</div>
            </div>
          `;
        } else if (chan.type === 'colorbars') {
          tvChannelContent.innerHTML = `
            <div class="tv-color-bars">
              <div class="color-bar bar-white"></div>
              <div class="color-bar bar-yellow"></div>
              <div class="color-bar bar-cyan"></div>
              <div class="color-bar bar-green"></div>
              <div class="color-bar bar-magenta"></div>
              <div class="color-bar bar-red"></div>
              <div class="color-bar bar-blue"></div>
            </div>
            <div class="tv-test-overlay">SMPTE TEST</div>
          `;
        } else if (chan.type === 'standby') {
          tvChannelContent.innerHTML = `
            <div class="tv-standby">
              <div class="standby-circle">
                <div class="standby-crosshair"></div>
                <div class="standby-text">PLEASE STAND BY</div>
              </div>
            </div>
          `;
        } else if (chan.type === 'lyrics') {
          tvChannelContent.innerHTML = `
            <div class="tv-lyrics">
              <p class="lyrics-text">"${chan.text}"</p>
              <p class="lyrics-source">${chan.source}</p>
            </div>
          `;
        }
      }
    }

    tvPowerSwitch.addEventListener('click', () => {
      tvPower = !tvPower;
      if (tvPower) {
        tvPowerSwitch.classList.remove('off');
        tvPowerSwitch.classList.add('on');
      } else {
        tvPowerSwitch.classList.remove('on');
        tvPowerSwitch.classList.add('off');
      }
      updateTV();
    });

    let knobRotation = 0;
    tvKnob.addEventListener('click', () => {
      if (!tvPower) return;
      tvChannel = (tvChannel % 13) + 1;
      knobRotation += 27.69; // 360 degrees divided by 13 channels
      tvKnob.style.transform = `rotate(${knobRotation}deg)`;
      updateTV();
    });

    document.querySelectorAll('.channel-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (!tvPower) return;
        tvChannel = parseInt(e.target.dataset.channel);
        knobRotation = (tvChannel - 1) * 27.69;
        tvKnob.style.transform = `rotate(${knobRotation}deg)`;
        updateTV();
      });
    });

    // Initialize TV as OFF
    updateTV();
  </script>

</body>

</html>
